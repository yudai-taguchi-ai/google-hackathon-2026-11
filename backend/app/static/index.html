<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tsunami Evacuation Navi</title>
<style>
  * { box-sizing: border-box; }
  fieldset { min-width: 0; }
  button, select { max-width: 100%; white-space: normal; }
  body { overflow-wrap: anywhere; }
  button:disabled { opacity: .6; }
  button.big .ja { color: inherit; }
  :root { color-scheme: light; }
  body { font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; max-width: 720px; margin: 0 auto; padding: 16px; background: #fff; color: #0f172a; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .ja { color: #64748b; font-size: 13px; }
  fieldset { border: 1px solid #cbd5e1; border-radius: 10px; margin: 12px 0; padding: 10px 12px; }
  button { font-size: 15px; margin: 4px 4px 4px 0; padding: 8px 12px; border-radius: 8px; border: 1px solid #94a3b8; background: #f8fafc; cursor: pointer; }
  button.big { background: #b91c1c; color: #fff; border: none; font-size: 18px; padding: 12px 16px; }
  .alert { background: #b91c1c; color: #fff; padding: 10px 12px; border-radius: 8px; margin: 10px 0; }
  .noalert { background: #f59e0b; color: #111; padding: 10px 12px; border-radius: 8px; margin: 10px 0; }
  .message { font-size: 17px; margin: 10px 0; }
  .card { border: 1px solid #cbd5e1; border-radius: 10px; padding: 10px 12px; margin: 8px 0; }
  .note { color: #475569; font-size: 12px; }
</style>
</head>
<body>
<h1>Tsunami Evacuation Navi</h1>
<div class="ja">津波避難ナビ（旅行者向け）Web 版。スマホのアプリは通信が無くても動きます。この Web 版は通信がある時だけ動きます。</div>

<fieldset>
  <legend>1. Warning <span class="ja">警報</span></legend>
  <button id="replay">Receive warning (training replay) <span class="ja">訓練電文を流し直す</span></button>
  <button id="refreshAlert">Check again / 警報を再確認</button>
  <div id="alertbox" class="note" role="status" aria-live="polite">Checking warning status… / 警報を確認中</div>
</fieldset>

<fieldset>
  <legend>2. Options <span class="ja">条件</span></legend>
  <select id="lang" aria-label="Language / 言語">
    <option value="en">English</option>
    <option value="ja">日本語</option>
  </select>
  <label><input type="checkbox" id="slow"> Cannot walk fast (child, elderly, injury) <span class="ja">速く歩けない</span></label>
</fieldset>

<fieldset>
  <legend>3. Where are you? <span class="ja">いる場所</span></legend>
  <button data-lat="34.5813" data-lon="135.4673">Nankai Sakai Sta. <span class="ja">南海 堺駅の東</span></button>
  <button data-lat="34.6545" data-lon="135.4290">Kaiyukan <span class="ja">海遊館</span></button>
  <button data-lat="34.5786" data-lon="135.4610">Ohama Park <span class="ja">大浜公園</span></button>
  <button id="here" class="big">I felt shaking — use my location <span class="ja">揺れた（現在地）</span></button>
</fieldset>

<p id="conditions" class="note"></p>
<div id="out" role="status" aria-live="polite"></div>
<button id="retry" hidden>Retry / 再試行</button>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
}[c]));
const TIMEOUT_MS = 30000;
let position = null;
let shakeAt = null;
let planVersion = 0;
let alertVersion = 0;
let locationVersion = 0;
let planController = null;
let alertController = null;
let retryAction = null;

async function requestJson(url, options, controller) {
  const timeout = setTimeout(() => controller.abort(), TIMEOUT_MS);
  try {
    const response = await fetch(url, { ...options, signal: controller.signal });
    if (!response.ok) {
      throw new Error(response.status === 422
        ? "This location or input is outside the supported range. / 対象地域外、または入力が不正です。"
        : "The server could not complete the request. / サーバーで処理できませんでした。");
    }
    return await response.json();
  } catch (error) {
    if (controller.signal.aborted) throw new Error("The request timed out. / 通信がタイムアウトしました。");
    if (error instanceof TypeError) throw new Error("Could not connect. Check your connection. / 通信に失敗しました。接続を確認してください。");
    if (error instanceof SyntaxError) throw new Error("Could not read the server response. / サーバーの応答を読み取れませんでした。");
    throw error;
  } finally {
    clearTimeout(timeout);
  }
}

function alertMarkup(a) {
  const training = a.active && (a.is_training || a.replaying || a.source === "training_replay");
  const failed = a.jma_error || !a.jma_checked_at || typeof a.active !== "boolean";
  const checked = a.jma_checked_at
    ? new Date(a.jma_checked_at).toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" }) : "—";
  if (training) {
    return `<div class="alert">Training replay / 訓練電文: ${esc(a.kind)} — ${esc(a.area_name || "大阪府")}<br>
      Not a live warning / 実際の警報ではありません
      ${failed ? '<br>Live warning status unavailable / 実際の警報の有無は確認できません' : ''}</div>`;
  }
  if (failed) {
    return `<div class="noalert">Warning status unavailable / 警報の有無は確認できません。再確認してください。
      ${a.active ? `<br>Previously received warning / 以前受け取った警報: ${esc(a.kind)}（最新の状態は未確認）` : ''}</div>`;
  }
  if (a.active) {
    return `<div class="alert">JMA: ${esc(a.kind)} — Osaka (checked ${esc(checked)})<br>
      気象庁の警報・注意報（訓練ではありません）</div>`;
  }
  return `<div class="noalert">JMA live check: no tsunami warning for Osaka (checked ${esc(checked)}).<br>
    確認時点では大阪府に津波の警報・注意報なし。強い揺れを感じたら警報を待たずに避難してください。</div>`;
}

function cancelPlan() {
  planVersion++;
  planController?.abort();
  planController = null;
  $('out').setAttribute('aria-busy', 'false');
}

function showError(error, retry) {
  $('out').textContent = error.message;
  retryAction = retry;
  $('retry').hidden = false;
}

function updateConditions() {
  $('conditions').textContent = position
    ? `${position.label} (${position.lat.toFixed(5)}, ${position.lon.toFixed(5)}) · ${$('lang').value === 'ja' ? '日本語' : 'English'} · ${$('slow').checked ? 'Slow / ゆっくり (0.5 m/s)' : 'Normal / 通常 (0.62 m/s)'}`
    : '';
}

async function checkAlert(replay = false) {
  const version = ++alertVersion;
  alertController?.abort();
  const controller = alertController = new AbortController();
  // Plans made before replay must not restore the previous warning or time basis.
  cancelPlan();
  $('out').textContent = '';
  $('retry').hidden = true;
  $('replay').disabled = $('refreshAlert').disabled = true;
  $('alertbox').textContent = replay
    ? 'Starting training replay… / 訓練を開始中'
    : 'Checking warning status… / 警報を確認中';
  try {
    const a = await requestJson(replay ? '/api/alert/replay' : '/api/alert', {
      method: replay ? 'POST' : 'GET',
    }, controller);
    if (version !== alertVersion) return;
    $('alertbox').innerHTML = alertMarkup(a);
  } catch (error) {
    if (version !== alertVersion) return;
    $('alertbox').textContent = `Warning status unavailable / 警報の有無は確認できません。${error.message} 「警報を再確認」を押してください。`;
  } finally {
    if (version === alertVersion) {
      alertController = null;
      $('replay').disabled = $('refreshAlert').disabled = false;
      if (position) run();
    }
  }
}

function timeBasis(plan, alert) {
  if (plan.time_source === 'jma_alert') {
    return alert.is_training || alert.replaying || alert.source === 'training_replay'
      ? 'JMA arrival time (training telegram) / 気象庁の到達予想時刻（訓練電文）'
      : 'JMA arrival time / 気象庁の到達予想時刻';
  }
  return ({
    cached_alert: 'Last received JMA time / 受け取った到達予想時刻',
    shake_plus_26: 'Shaking time + 26 min (estimate) / 揺れた時刻＋26分（目安）',
    default_26: 'Now + 26 min (estimate) / 今＋26分（目安）',
  })[plan.time_source] || 'Time basis unavailable / 時刻の基準を確認できません';
}

function card(o, label) {
  if (!o) return '<p>No evacuation destination returned / 避難先を取得できませんでした。</p>';
  // Keep links on Google Maps even when a response contains an unexpected maps_url.
  const maps = new URL('https://www.google.com/maps/dir/');
  maps.search = new URLSearchParams({
    api: '1', destination: `${o.lat},${o.lon}`, travelmode: 'walking', dir_action: 'navigate',
  });
  const destination = o.type === 'go_upstairs'
    ? `building, floor ${esc(o.floor_min ?? 'top')} or higher / ${esc(o.floor_min ?? '最上')}階以上`
    : 'outside the flood zone / 浸水想定区域の外';
  return `<div class="card">
    <div>${label}: <b>${esc(o.name)}</b> (${esc(o.city)})</div>
    <div class="ja">${esc(o.address)}</div>
    <div>About ${Math.round(o.walk_min)} min on foot · ${destination}</div>
    <a href="${esc(maps.href)}" target="_blank" rel="noopener">Open walking directions in Google Maps</a>
  </div>`;
}

async function run() {
  if (!position) return;
  cancelPlan();
  updateConditions();
  $('retry').hidden = true;
  if (alertController) {
    $('out').textContent = 'Waiting for warning check… / 警報の確認後に計算します';
    return;
  }
  const version = planVersion;
  const warningVersion = alertVersion;
  const controller = planController = new AbortController();
  shakeAt = shakeAt ?? Date.now();
  const input = {
    lat: position.lat, lon: position.lon, lang: $('lang').value,
    slow: $('slow').checked, shake_at_ms: shakeAt,
  };
  $('out').textContent = 'Calculating… / 計算中';
  $('out').setAttribute('aria-busy', 'true');
  try {
    const { alert, plan, explanation } = await requestJson('/api/plan', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(input),
    }, controller);
    if (version !== planVersion) return;
    if (!alert || !plan || !Array.isArray(plan.alternatives)) {
      throw new Error('Incomplete server response / サーバーの応答が不完全です。');
    }
    if (warningVersion === alertVersion) $('alertbox').innerHTML = alertMarkup(alert);
    const walkingSource = plan.walking_time_source === 'routes_api'
      ? 'Routes API distance' : 'straight line × 1.3 (estimate)';
    $('out').innerHTML = `${alertMarkup(alert)}
      <p>About ${Math.round(plan.minutes_left)} min left / 残り約${Math.round(plan.minutes_left)}分<br>${esc(timeBasis(plan, alert))}</p>
      <div class="message">${esc(explanation?.message)}</div>
      ${card(plan.primary, 'Go to')}
      ${plan.alternatives.map(o => card(o, 'Other option')).join('')}
      <p class="note">Shelters: GSI designated tsunami evacuation sites / 国土地理院 指定緊急避難場所（津波） ·
        Flood depth: MLIT (Osaka 2023) / 国土数値情報 ·
        Walking: ${walkingSource} ÷ ${input.slow ? '0.5' : '0.62'} m/s ·
        Explanation: ${explanation?.source === 'gemini' ? 'Gemini' : 'fixed text'}</p>`;
  } catch (error) {
    if (version === planVersion) showError(error, run);
  } finally {
    if (version === planVersion) {
      planController = null;
      $('out').setAttribute('aria-busy', 'false');
    }
  }
}

function selectPosition(lat, lon, label) {
  locationVersion++;
  position = { lat, lon, label };
  shakeAt = shakeAt ?? Date.now();
  run();
}

function locate() {
  const version = ++locationVersion;
  cancelPlan();
  position = null;
  shakeAt = shakeAt ?? Date.now();
  updateConditions();
  $('retry').hidden = true;
  $('out').textContent = 'Getting your location… / 現在地を取得中';
  const fail = (error) => {
    if (version !== locationVersion) return;
    const messages = {
      1: 'Location permission denied. Allow location access or select a demo location. / 位置情報が許可されていません。設定を変更するか地点ボタンを選んでください。',
      2: 'Location unavailable. / 現在地を取得できませんでした。',
      3: 'Location request timed out. / 現在地の取得がタイムアウトしました。',
    };
    showError(new Error(messages[error.code]
      || 'Geolocation is unavailable in this browser. / このブラウザでは位置情報を利用できません。'), locate);
  };
  if (!navigator.geolocation) {
    fail({});
    return;
  }
  navigator.geolocation.getCurrentPosition(p => {
    if (version === locationVersion) {
      selectPosition(p.coords.latitude, p.coords.longitude, 'Current location / 現在地');
    }
  }, fail, { timeout: 10000, maximumAge: 0, enableHighAccuracy: true });
}

$('retry').addEventListener('click', () => retryAction?.());
$('replay').addEventListener('click', () => checkAlert(true));
$('refreshAlert').addEventListener('click', () => checkAlert());
$('lang').addEventListener('change', run);
$('slow').addEventListener('change', run);
document.querySelectorAll('button[data-lat]').forEach(b =>
  b.addEventListener('click', () => selectPosition(+b.dataset.lat, +b.dataset.lon, b.textContent.trim())));
$('here').addEventListener('click', locate);
checkAlert();
</script>
</body>
</html>
