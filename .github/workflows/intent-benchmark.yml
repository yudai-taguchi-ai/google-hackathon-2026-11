name: intent-benchmark
on:
  push:
    paths:
      - 'intent-benchmark/**'
      - '.github/workflows/intent-benchmark.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle -p intent-benchmark :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: intent-benchmark-apk
          path: intent-benchmark/app/build/outputs/apk/debug/app-debug.apk
