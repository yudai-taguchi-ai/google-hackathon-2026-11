name: web

on:
  pull_request:
    paths:
      - 'backend/app/static/index.html'
      - 'backend/tests/web/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/tests/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/tests/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-test-results
          path: backend/tests/web/test-results/
          retention-days: 7
